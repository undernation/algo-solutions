<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title description">
<title id="title">② 꼭짓점 접촉만으로는 연결 안 됨</title>
<desc id="description">첫 번째 예제의 N=20 보드 중 x=0~8, y=0~4를 같은 비율로 확대한 그림. 블록 안의 숫자는 블록 ID이다. 점선은 새 블록 ID 3이다. 같은 색은 추가가 끝난 뒤 같은 구역임을 뜻한다. ID 3은 ID 7과 점 하나만 공유한다. addBlock 반환값은 4. 구역 7: 면적 10 / 구역 3: 면적 4.</desc>
<style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="0" y="0" width="720" height="640" rx="16" fill="#ffffff"/>
<text x="28" y="42" font-size="27" fill="#17283e" text-anchor="start" font-weight="700">② 꼭짓점 접촉만으로는 연결 안 됨</text>
<text x="28" y="79" font-size="23" fill="#475569" text-anchor="start" font-weight="400">ID 3은 ID 7과 점 하나만 공유한다.</text>
<rect x="30" y="99" width="22" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="64" y="117" font-size="20" fill="#243449" text-anchor="start" font-weight="400">같은 색 = 같은 구역</text>
<rect x="405" y="99" width="22" height="22" rx="3" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="5 3"/>
<text x="440" y="117" font-size="20" fill="#243449" text-anchor="start" font-weight="400">점선 = 새 블록</text>
