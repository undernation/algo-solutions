<line x1="88" y1="442" x2="88" y2="168" stroke="#64748b" stroke-width="2" />
<text x="628" y="449" font-size="22" fill="#475569" text-anchor="start" font-weight="400">x</text>
<text x="88" y="156" font-size="22" fill="#475569" text-anchor="middle" font-weight="400">y</text>
<g data-block-id="20" data-region-id="7" data-coordinates="0,0,2,2">
<rect x="88" y="314" width="128" height="128" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
<text x="152.0" y="387.0" font-size="27" fill="#17283e" text-anchor="middle" font-weight="700">ID 20</text>
</g>
