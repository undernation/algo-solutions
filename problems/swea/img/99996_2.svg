<text x="344" y="474" font-size="20" fill="#64748b" text-anchor="middle" font-weight="400">4</text>
<line x1="408" y1="186" x2="408" y2="442" stroke="#e2e8f0" stroke-width="1" />
<text x="408" y="474" font-size="20" fill="#64748b" text-anchor="middle" font-weight="400">5</text>
<line x1="472" y1="186" x2="472" y2="442" stroke="#e2e8f0" stroke-width="1" />
<text x="472" y="474" font-size="20" fill="#64748b" text-anchor="middle" font-weight="400">6</text>
<line x1="536" y1="186" x2="536" y2="442" stroke="#e2e8f0" stroke-width="1" />
<text x="536" y="474" font-size="20" fill="#64748b" text-anchor="middle" font-weight="400">7</text>
