<circle cx="472" cy="314" r="8" fill="#ffffff" stroke="#d43d53" stroke-width="4"/>
<path d="M 466 314 L 425 270 L 330 270" fill="none" stroke="#d43d53" stroke-width="2"/>
<text x="216" y="255" font-size="24" fill="#be3147" text-anchor="start" font-weight="700">(6, 2) 점 하나</text>
<rect x="28" y="504" width="664" height="108" rx="12" fill="#f1f5f9"/>
<text x="48" y="545" font-size="27" fill="#17283e" text-anchor="start" font-weight="700">addBlock 반환값 = 4</text>
<text x="48" y="586" font-size="24" fill="#334155" text-anchor="start" font-weight="400">구역 7: 면적 10 / 구역 3: 면적 4</text>
</svg>
