</g>
<g data-block-id="15" data-region-id="7" data-coordinates="2,0,4,1">
<rect x="216" y="378" width="128" height="64" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
<text x="280.0" y="419.0" font-size="27" fill="#17283e" text-anchor="middle" font-weight="700">ID 15</text>
</g>
<g data-block-id="3" data-region-id="3" data-coordinates="6,2,8,4">
<rect x="472" y="186" width="128" height="128" fill="#ffedd5" stroke="#334155" stroke-width="3" stroke-dasharray="9 5"/>
<text x="536.0" y="247.0" font-size="27" fill="#17283e" text-anchor="middle" font-weight="700">ID 3</text>
<text x="536.0" y="272.0" font-size="20" fill="#334155" text-anchor="middle" font-weight="400">새 블록</text>
