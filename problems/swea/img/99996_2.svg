<text x="68" y="385" font-size="20" fill="#64748b" text-anchor="end" font-weight="400">1</text>
<line x1="88" y1="314" x2="600" y2="314" stroke="#e2e8f0" stroke-width="1" />
<text x="68" y="321" font-size="20" fill="#64748b" text-anchor="end" font-weight="400">2</text>
<line x1="88" y1="250" x2="600" y2="250" stroke="#e2e8f0" stroke-width="1" />
<text x="68" y="257" font-size="20" fill="#64748b" text-anchor="end" font-weight="400">3</text>
