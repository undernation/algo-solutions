name: 잔디 · 인덱스 자동 갱신

on:
  push:
    branches: [master, main]
    paths:                      # 풀이/문제 자료/생성 코드가 바뀔 때
      - 'boj/**'
      - 'swea/**'
      - 'codetree/**'
      - 'problems/**'
      - '_meta/history.json'
      - '_meta/codetree_list.json'    # 번호 없는 옛 기록 ↔ 코드트리 문제 연결에 쓰인다
      - '_meta/_dashboard_tpl.py'
      - '_meta/build_probindex.py'
      - '_meta/build_heatmap.py'
      - '_meta/build_index.py'
      - '.github/workflows/heatmap.yml'
  schedule:
    - cron: '0 16 * * *'        # 매일 UTC 16:00 = KST 01:00
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: heatmap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 회차별 코드 링크가 git log 로 커밋 해시를 찾는다
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 최신 커밋 기준 생성 · 커밋 · 푸시
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # 이 작업만 쓰는 일회성 runner 체크아웃이다. 이전 시도의 생성 커밋을
            # 버리고 원격 최신 코드/데이터에서 다시 생성해 다른 작성자의 변경을 보존한다.
            git fetch origin "$TARGET_BRANCH"
            git reset --hard FETCH_HEAD

            python _meta/build_probindex.py
            python _meta/build_heatmap.py
            python _meta/build_index.py

            git add README.md HEATMAP.md index.html \
              assets/heatmap.svg assets/heatmap.html \
              _meta/history.json _meta/built.json problems/index.json
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              exit 0
            fi
            git commit -m "chore: 잔디·인덱스 자동 갱신 ($(date -u +%Y-%m-%d))"
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              exit 0
            fi
            echo "푸시 실패 ($attempt/3) — 다음 시도에서 최신 원격 기준으로 재생성"
          done
          echo "::error::자동 갱신을 세 번 시도했지만 푸시하지 못했습니다."
          exit 1
